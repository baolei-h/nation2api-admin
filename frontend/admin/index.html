<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notion2API · Admin</title>
<style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#182131;background:#f5f7fb;font-size:14px}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
#login-screen{display:grid;place-items:center;min-height:100vh;padding:20px;background:radial-gradient(circle at top left,#dbe8ff 0,transparent 45%),#f6f8fb}
.login-card{width:min(420px,100%);background:#fff;border:1px solid #e2e7ee;padding:34px;border-radius:18px;box-shadow:0 18px 45px #273b5511}
.logo{width:38px;height:38px;border-radius:11px;background:#2563eb;color:white;display:grid;place-items:center;font-weight:750;font-size:19px}
h1{font-size:25px;margin:16px 0 7px;letter-spacing:-.5px}.muted{color:#697586;line-height:1.65}.small{font-size:12px}.login-card label,.form label{display:block;font-weight:600;margin:14px 0 6px}
input,textarea,select{background:#fff;color:#152133;border:1px solid #d9e1eb;border-radius:9px;padding:10px 11px;width:100%;outline:none}input:focus,select:focus,textarea:focus{border-color:#3972ef;box-shadow:0 0 0 3px #3972ef20}textarea{min-height:100px;resize:vertical}
.btn{border:1px solid #dce3ed;border-radius:9px;background:white;color:#26364b;padding:9px 13px;min-height:37px;font-weight:550;display:inline-flex;align-items:center;gap:7px;justify-content:center}.btn:hover{background:#f3f7ff}.primary{background:#2563eb;border-color:#2563eb;color:white}.primary:hover{background:#1d4ed8}.danger{color:#b91c1c;border-color:#f2c5c5}.danger:hover{background:#fef2f2}.ghost{border:0;background:transparent}.full{width:100%}
#app{display:none;min-height:100vh}.sidebar{background:#fff;border-right:1px solid #e4e9f0;width:238px;position:fixed;inset:0 auto 0 0;padding:26px 15px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;gap:11px;align-items:center;padding:5px 11px}.brand strong{font-size:16px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;text-align:left;border-radius:9px;padding:12px 13px;color:#536172;font-weight:550}.nav button:hover{background:#f3f6fc}.nav button.active{background:#eaf1ff;color:#1d4ed8}.bottom{margin-top:auto;border-top:1px solid #e4e9f0;padding-top:15px}
main{margin-left:238px;padding:35px clamp(18px,4vw,55px);max-width:1600px}.top{display:flex;align-items:start;justify-content:space-between;gap:15px;margin-bottom:25px}.top h1{margin:0 0 7px}h2{font-size:17px;margin:0 0 15px}.panel{background:#fff;border:1px solid #e3e9f1;border-radius:14px;padding:20px;margin-bottom:19px;box-shadow:0 2px 10px #243d5405}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.metric{padding:18px}.metric span{color:#64748b;font-size:12px}.metric strong{display:block;margin-top:10px;font-size:29px;letter-spacing:-.5px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;text-align:left;min-width:680px}.table th{background:#f9fbfe;color:#64748b;font-weight:600;font-size:12px}.table td,.table th{border-bottom:1px solid #eef2f6;padding:11px 12px;white-space:nowrap}.table tr:last-child td{border-bottom:0}.tag{font-size:11px;border-radius:8px;padding:5px 8px;background:#ecfdf5;color:#047857;font-weight:650}.tag.off{background:#f3f4f6;color:#667085}.tag.warn{background:#fff7e6;color:#92400e}
.actions{display:flex;gap:6px;flex-wrap:wrap}.actions .btn{font-size:12px;min-height:31px;padding:6px 9px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 18px}.form-grid .wide{grid-column:1/-1}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}.toolbar input{max-width:260px}.stack{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.notice{border-radius:9px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:12px 14px;line-height:1.6;margin:15px 0}.notice.warn{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
.modal-backdrop{position:fixed;inset:0;background:#11182775;display:none;place-items:center;z-index:5;padding:18px}.modal{background:white;border-radius:14px;padding:23px;max-width:550px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 15px 65px #0003}.modal-header{display:flex;justify-content:space-between;align-items:center}.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.bar{height:9px;background:#e9eef6;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb;border-radius:99px}#toast{position:fixed;right:24px;bottom:20px;background:#172a45;color:#fff;border-radius:9px;padding:13px 18px;display:none;z-index:9;max-width:380px}
.checklist{max-height:200px;overflow:auto;border:1px solid #d9e1eb;border-radius:10px;padding:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.checklist label{font-weight:400;font-size:12px;margin:0;padding:5px}.checklist input{width:auto;margin-right:6px}.code-secret{background:#f8fafc;padding:12px;word-break:break-all;font-family:ui-monospace,Consolas,monospace;border-radius:8px;border:1px dashed #9db1c8}
@media(max-width:900px){.sidebar{width:73px;padding:22px 9px}.brand strong,.nav .nav-label,.bottom span{display:none}.nav button{text-align:center;font-size:20px}.nav button .nav-label{display:none}main{margin-left:73px;padding:23px 16px}.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:590px){.sidebar{position:static;width:100%;height:auto;flex-direction:row;padding:10px;align-items:center;overflow:auto}.nav{flex-direction:row}.nav button{padding:8px}.brand{display:none}.bottom{margin:0;border:0;padding:0}main{margin:0;padding:16px}.grid4{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="login-screen"><div class="login-card"><div class="logo">N</div><h1>Notion2API 管理后台</h1><p class="muted">个人网关 · 管理员登录</p><form id="login-form"><label for="password">管理员密码</label><input id="password" type="password" minlength="14" required autocomplete="current-password"><button class="btn primary full" style="margin-top:20px" type="submit">安全登录</button></form><p class="muted small" id="login-notice">管理员登录需要 HTTPS；如果是 HTTP 测试部署，必须由服务端明确允许。</p><p id="login-error" style="color:#b91c1c"></p></div></section>
<div id="app"><aside class="sidebar"><div class="brand"><div class="logo">N</div><strong>Notion2API</strong></div><nav class="nav" id="nav">
<button data-page="overview" class="active">◫ <span class="nav-label">总览</span></button><button data-page="accounts">♧ <span class="nav-label">Notion 账号</span></button><button data-page="keys">⌑ <span class="nav-label">API 密钥</span></button><button data-page="models">◇ <span class="nav-label">模型管理</span></button><button data-page="usage">▥ <span class="nav-label">请求统计</span></button><button data-page="settings">⚙ <span class="nav-label">安全设置</span></button></nav><div class="bottom"><button class="btn ghost" id="logout">↪ <span>退出管理后台</span></button></div></aside>
<main><div class="top"><div><h1 id="page-title">总览</h1><p class="muted" id="page-subtitle">账号状态、API 使用情况与本地配额</p></div><button class="btn" id="refresh">↻ 刷新数据</button></div><div id="content"></div></main></div>
<div id="modal-backdrop" class="modal-backdrop"><div class="modal"><div class="modal-header"><h2 id="modal-title"></h2><button class="btn ghost" id="modal-close">✕</button></div><div id="modal-body"></div><div class="modal-footer"><button class="btn" id="modal-cancel">取消</button><button class="btn primary" id="modal-save">保存</button></div></div></div><div id="toast"></div>
<script>
'use strict';
const ROOT='/admin/api';let csrf='',page='overview', modelsCache=[], modalSubmit=null;
const $=q=>document.querySelector(q);
const escapeHTML=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=t=>t?new Date(t*1000).toLocaleString('zh-CN'):'—';
function toast(s){const x=$('#toast');x.textContent=s;x.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>x.style.display='none',4500)}
async function api(path,method='GET',body){const headers={};if(body!==undefined)headers['Content-Type']='application/json';if(!['GET','HEAD'].includes(method))headers['X-CSRF-Token']=csrf;let res;
 try{res=await fetch(ROOT+path,{method,headers,credentials:'same-origin',body:body!==undefined?JSON.stringify(body):undefined});}catch(e){throw Error('网络连接失败：'+e.message)}
 let data;try{data=await res.json()}catch{throw Error('服务器没有返回 JSON（HTTP '+res.status+'）')}
 if(!res.ok){if(res.status===401 && path!='/login')showLogin();throw Error(data.detail||data.error?.message||'HTTP '+res.status)}return data;}
function showLogin(){$('#app').style.display='none';$('#login-screen').style.display='grid'}
async function boot(){try{const s=await api('/session');csrf=s.csrf;$('#login-screen').style.display='none';$('#app').style.display='block';await navigate('overview')}catch{showLogin()}}
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();$('#login-error').textContent='';try{const s=await api('/login','POST',{password:$('#password').value});csrf=s.csrf;$('#password').value='';$('#login-screen').style.display='none';$('#app').style.display='block';await navigate('overview');if(!s.secure)toast('警告：当前 HTTP 连接不加密，请尽快配置 HTTPS')}catch(e){$('#login-error').textContent=e.message}});
$('#logout').addEventListener('click',async()=>{try{await api('/logout','POST',{})}catch{}csrf='';showLogin()});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)});$('#refresh').addEventListener('click',()=>navigate(page));
const titles={overview:['总览','账号状态、API 使用情况与本地配额'],accounts:['Notion 账号','增加、禁用和测试上游账号；凭据加密存储'],keys:['API 密钥','每把密钥独立限制请求次数与模型权限'],models:['模型管理','基础模型、推理强度别名及自定义映射'],usage:['请求统计','只记录元数据，不保存聊天内容'],settings:['安全设置','管理员密码及旧 API Key 管理']};
async function navigate(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#page-title').textContent=titles[p][0];$('#page-subtitle').textContent=titles[p][1];$('#content').innerHTML='<div class="panel muted">正在加载...</div>';try{await ({overview,accounts,keys,models,usage,settings})[p]()}catch(e){$('#content').innerHTML='<div class="panel"><p style="color:#b91c1c">'+escapeHTML(e.message)+'</p></div>'}}
function modal(title,body,save){$('#modal-title').textContent=title;$('#modal-body').innerHTML=body;modalSubmit=save;$('#modal-save').style.display=save?'':'none';$('#modal-backdrop').style.display='grid'}
function closeModal(){$('#modal-backdrop').style.display='none';modalSubmit=null}
$('#modal-close').onclick=closeModal;$('#modal-cancel').onclick=closeModal;$('#modal-save').onclick=async()=>{if(!modalSubmit)return;try{await modalSubmit();closeModal();await navigate(page)}catch(e){toast(e.message)}};
const metric=(label,value,sub='')=>'<div class="panel metric"><span>'+escapeHTML(label)+'</span><strong>'+escapeHTML(value)+'</strong><span>'+escapeHTML(sub)+'</span></div>';
const tag=(on,text)=>'<span class="tag '+(on?'':'off')+'">'+escapeHTML(text|| (on?'启用':'禁用'))+'</span>';
const btn=(label,act,id,danger=false)=>'<button class="btn '+(danger?'danger':'')+'" data-act="'+escapeHTML(act)+'" data-id="'+escapeHTML(id)+'">'+escapeHTML(label)+'</button>';
function clickActions(handler){$('#content').onclick=e=>{const b=e.target.closest('[data-act]');if(b)handler(b.dataset.act,b.dataset.id)}}
async function overview(){const a=await api('/overview');$('#content').innerHTML='<div class="grid4">'+metric('活跃 Notion 账号',a.pool.active,a.pool.cooling+' 个冷却中')+metric('有效 API Key',a.keys,'含独立配额')+metric('今日调用',a.today_requests,'UTC 自然日')+metric('今日 HTTP 失败',a.today_failed_http,'不含流式内容中途失败')+'</div><section class="panel"><h2>最近 7 天请求量</h2><div style="display:flex;gap:13px;align-items:end;height:160px;overflow:auto">'+(a.daily.length?a.daily.map(x=>'<div style="min-width:67px;text-align:center"><b>'+x.count+'</b><div class="bar" style="height:95px;width:34px;margin:7px auto;display:flex;align-items:end"><i style="height:'+Math.max(4,100*x.count/Math.max(1,...a.daily.map(y=>y.count)))+'%;width:100%"></i></div><span class="small muted">'+escapeHTML(x.day.slice(5))+'</span></div>').join(''):'<p class="muted">暂无请求数据</p>')+'</div></section><section class="panel"><h2>模型调用分布（近 30 天）</h2>'+(a.by_model.length?a.by_model.map(x=>'<div style="display:flex;gap:16px;align-items:center;margin:12px 0"><span style="width:220px;overflow:hidden;text-overflow:ellipsis">'+escapeHTML(x.model)+'</span><div class="bar" style="flex:1"><i style="width:'+Math.max(2,100*x.count/Math.max(...a.by_model.map(y=>y.count)))+'%"></i></div><strong>'+x.count+'</strong></div>').join(''):'<p class="muted">尚无模型调用记录</p>')+'</section><div class="notice">'+escapeHTML(a.note)+'</div>'}
function accountForm(item=null){return '<div class="form form-grid"><div><label>账号名称</label><input id="a-label" value="'+escapeHTML(item?.label||'')+'" placeholder="Notion 账号 2"></div><div><label>状态</label><select id="a-enabled"><option value="1">启用</option><option value="0" '+(item&&!item.enabled?'selected':'')+'>禁用</option></select></div><div class="wide"><label>token_v2 '+(item?'（留空表示不修改）':'（必填）')+'</label><input id="a-token" type="password" autocomplete="off" placeholder="来自你自己的 Notion 账号"></div><div><label>space_id</label><input id="a-space" placeholder="Workspace ID"></div><div><label>user_id</label><input id="a-user" placeholder="Notion User ID"></div><div><label>space_view_id（可选）</label><input id="a-view"></div><div><label>user_name（可选）</label><input id="a-name"></div><div class="wide"><label>user_email（可选）</label><input id="a-email" type="email"></div><p class="small muted wide">更新已有账号时，留空的凭据不会修改；账号信息不会被返回到浏览器。</p></div>'}
function accountCredentials(){const fields={token_v2:$('#a-token').value.trim(),space_id:$('#a-space').value.trim(),user_id:$('#a-user').value.trim(),space_view_id:$('#a-view').value.trim(),user_name:$('#a-name').value.trim(),user_email:$('#a-email').value.trim()};return Object.fromEntries(Object.entries(fields).filter(([k,v])=>v))}
async function accounts(){const a=await api('/accounts');$('#content').innerHTML='<section class="panel"><div class="toolbar"><div><h2>上游账号池</h2><p class="muted small">账号变更后自动热加载，不需要重建 Docker</p></div><button class="btn primary" id="add-account">＋ 新增账号</button></div><div class="table-wrap"><table class="table"><thead><tr><th>名称</th><th>邮箱</th><th>状态</th><th>最近检测</th><th>操作</th></tr></thead><tbody>'+a.items.map(x=>'<tr><td><b>'+escapeHTML(x.label)+'</b></td><td>'+escapeHTML(x.email||'—')+'</td><td>'+tag(x.enabled)+'</td><td>'+escapeHTML(x.last_test_result||'未测试')+'</td><td><div class="actions">'+btn('检测','test',x.id)+btn('编辑','edit',x.id)+btn(x.enabled?'禁用':'启用','toggle',x.id)+btn('删除','delete',x.id,true)+'</div></td></tr>').join('')+'</tbody></table></div></section><div class="notice warn">账号 token_v2 属于登录会话凭据。后台不显示原值，也不要把 accounts.json 或加密密钥上传到公开 GitHub。</div>';
$('#add-account').onclick=()=>modal('新增 Notion 账号',accountForm(),async()=>{await api('/accounts','POST',{label:$('#a-label').value,enabled:$('#a-enabled').value==='1',credentials:accountCredentials()});toast('账号已添加并热加载')});
clickActions(async(act,id)=>{const item=a.items.find(x=>x.id===id);try{if(act==='test'){toast('正在验证...');const r=await api('/accounts/'+id+'/test','POST',{});toast(r.ok?'账号有效，可见 '+r.models+' 个模型':r.message||'测试失败');await navigate(page)}if(act==='edit')modal('编辑账号：'+item.label,accountForm(item),async()=>{await api('/accounts/'+id,'PUT',{label:$('#a-label').value,enabled:$('#a-enabled').value==='1',credentials:accountCredentials()});toast('已保存并热加载')});if(act==='toggle'){await api('/accounts/'+id,'PUT',{enabled:!item.enabled});toast('状态已更新');await navigate(page)}if(act==='delete'&&confirm('确定删除账号 '+item.label+'？此操作不可撤销。')){await api('/accounts/'+id,'DELETE');await navigate(page)}}catch(e){toast(e.message)}})}
function keyForm(items=[]){return '<div class="form form-grid"><div class="wide"><label>密钥名称</label><input id="k-label" placeholder="Cherry Studio / 我的笔记本"></div><div><label>每分钟请求上限（0=不限）</label><input id="k-rpm" type="number" min="0" value="0"></div><div><label>每日请求上限（0=不限）</label><input id="k-day" type="number" min="0" value="500"></div><div><label>每月请求上限（0=不限）</label><input id="k-month" type="number" min="0" value="10000"></div><div class="wide"><label>允许的模型（不勾选=全部启用模型）</label><div class="checklist">'+items.filter(x=>x.enabled).map(x=>'<label><input type="checkbox" class="k-model" value="'+escapeHTML(x.id)+'">'+escapeHTML(x.name)+'</label>').join('')+'</div></div></div>'}
async function keys(){const [data,mods]=await Promise.all([api('/keys'),api('/models')]);modelsCache=mods.items;$('#content').innerHTML='<section class="panel"><div class="toolbar"><div><h2>API Key</h2><p class="muted small">密钥只在创建时显示一次，数据库仅存储哈希</p></div><button class="btn primary" id="new-key">＋ 创建密钥</button></div><div class="table-wrap"><table class="table"><thead><tr><th>名称</th><th>Key 前缀</th><th>状态</th><th>日 / 月 / 分钟上限</th><th>最后使用</th><th>操作</th></tr></thead><tbody>'+data.items.map(x=>'<tr><td><b>'+escapeHTML(x.label)+'</b></td><td><code>'+escapeHTML(x.prefix)+'…</code></td><td>'+tag(x.enabled)+'</td><td>'+x.daily_limit+' / '+x.monthly_limit+' / '+x.rpm_limit+'</td><td>'+date(x.last_used_at)+'</td><td><div class="actions">'+btn('限额/模型','edit',x.id)+btn(x.enabled?'停用':'启用','toggle',x.id)+btn('删除','delete',x.id,true)+'</div></td></tr>').join('')+'</tbody></table></div></section><div class="notice">每天和每月的配额按 UTC 时间计算；只有聊天补全请求计入额度，查看模型列表不扣除请求数。</div>';
$('#new-key').onclick=()=>modal('创建 API Key',keyForm(modelsCache),async()=>{const res=await api('/keys','POST',{label:$('#k-label').value,rpm_limit:+$('#k-rpm').value,daily_limit:+$('#k-day').value,monthly_limit:+$('#k-month').value,allowed_models:[...document.querySelectorAll('.k-model:checked')].map(x=>x.value)});setTimeout(()=>{modal('请立即保存新 API Key','<p class="muted">密钥只会显示这一次，关闭后无法找回。</p><div class="code-secret" id="secret-value">'+escapeHTML(res.secret)+'</div><button class="btn primary" id="copy-secret" style="margin-top:12px">复制密钥</button>',null);$('#copy-secret').onclick=async()=>{try{await navigator.clipboard.writeText(res.secret);toast('已复制')}catch{toast('此浏览器 HTTP 环境不支持剪贴板，请手动选中复制')}}},0)});
clickActions(async(act,id)=>{const item=data.items.find(x=>x.id===id);try{if(act==='toggle'){await api('/keys/'+id,'PUT',{enabled:!item.enabled});await navigate(page)}if(act==='delete'&&confirm('永久删除该 API Key？')){await api('/keys/'+id,'DELETE');await navigate(page)}if(act==='edit'){modal('修改 API Key：'+item.label,keyForm(modelsCache),async()=>{await api('/keys/'+id,'PUT',{label:$('#k-label').value,rpm_limit:+$('#k-rpm').value,daily_limit:+$('#k-day').value,monthly_limit:+$('#k-month').value,allowed_models:[...document.querySelectorAll('.k-model:checked')].map(x=>x.value)});toast('已修改')});$('#k-label').value=item.label;$('#k-rpm').value=item.rpm_limit;$('#k-day').value=item.daily_limit;$('#k-month').value=item.monthly_limit;document.querySelectorAll('.k-model').forEach(x=>x.checked=item.allowed_models.includes(x.value))}}catch(e){toast(e.message)}})}
async function models(){const a=await api('/models');modelsCache=a.items;$('#content').innerHTML='<section class="panel"><div class="toolbar"><div><h2>已注册模型</h2><p class="muted small">支持启用、禁用与自定义 Notion 内部代号；禁用基础模型也会禁用其推理档位变体</p></div><div class="stack"><input id="model-search" placeholder="筛选模型"><button class="btn primary" id="new-model">＋ 自定义模型</button></div></div><div id="model-table" class="table-wrap"></div></section><div class="notice">模型与 Notion 内部代号由你当前的已有补丁维护。新增自定义映射需要你已从 Notion 官方模型目录核对真实代号。</div>';
const render=()=>{const q=$('#model-search').value.toLowerCase();const rows=a.items.filter(x=>(x.id+' '+x.name+' '+x.code).toLowerCase().includes(q));$('#model-table').innerHTML='<table class="table"><thead><tr><th>模型 ID</th><th>显示名称</th><th>Notion 内部代号</th><th>状态</th><th>操作</th></tr></thead><tbody>'+rows.map(x=>'<tr><td><code>'+escapeHTML(x.id)+'</code></td><td>'+escapeHTML(x.name)+'</td><td><span class="small muted">'+escapeHTML(x.code)+'</span></td><td>'+tag(x.enabled)+'</td><td><div class="actions">'+btn(x.enabled?'禁用':'启用','toggle',x.id)+(x.custom?btn('删除','delete',x.id,true):'')+'</div></td></tr>').join('')+'</tbody></table>'};$('#model-search').oninput=render;render();$('#new-model').onclick=()=>modal('添加自定义模型','<div class="form"><label>API 模型 ID</label><input id="m-id" placeholder="my-new-model"><label>Notion 内部代号</label><input id="m-code" placeholder="真实内部代号"><label>显示名称</label><input id="m-label" placeholder="我的新模型"></div>',async()=>{await api('/models/custom','POST',{id:$('#m-id').value,code:$('#m-code').value,name:$('#m-label').value});toast('模型已动态注册')});clickActions(async(act,id)=>{const m=a.items.find(x=>x.id===id);try{if(act==='toggle'){await api('/models/'+encodeURIComponent(id),'PUT',{enabled:!m.enabled});await navigate(page)}if(act==='delete'&&confirm('删除自定义模型 '+id+'？')){await api('/models/custom/'+encodeURIComponent(id),'DELETE');await navigate(page)}}catch(e){toast(e.message)}})}
async function usage(){const a=await api('/usage');$('#content').innerHTML='<section class="panel"><div class="toolbar"><h2>最近请求（上限 100 条）</h2><span class="muted small">仅记录模型、密钥名称、HTTP 状态和耗时</span></div><div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>API Key</th><th>模型</th><th>HTTP 状态</th><th>耗时</th></tr></thead><tbody>'+a.items.map(x=>'<tr><td>'+date(x.at)+'</td><td>'+escapeHTML(x.key_label)+'</td><td>'+escapeHTML(x.model)+'</td><td>'+tag(x.status>=200&&x.status<400,x.status===0?'处理中':String(x.status))+'</td><td>'+escapeHTML(x.duration_ms??'—')+' ms</td></tr>').join('')+'</tbody></table></div></section><div class="notice warn">流式请求可能先返回 HTTP 200，之后发生上游错误；这里的 HTTP 状态不是完整生成成功率。Notion 官方账户剩余额度不可确认。</div>'}
async function settings(){const [s,a]=await Promise.all([api('/settings'),api('/audits')]);$('#content').innerHTML='<section class="panel"><h2>访问控制</h2><p>运行模式：<b>'+escapeHTML(s.mode)+'</b>（只读，修改需重启）</p><p>旧版 .env API Key：'+tag(s.legacy_api_key_enabled,s.legacy_api_key_enabled?'仍可使用':'已停用')+'</p><button class="btn" id="toggle-legacy">'+(s.legacy_api_key_enabled?'停用':'启用')+'旧版 API Key</button><div class="notice warn">后台登录必须使用 HTTPS（除非在安装时明确开启 HTTP 测试模式）。旧 API Key 不计入任何新建 Key 的独立限额。</div></section><section class="panel"><h2>修改管理员密码</h2><form id="pw-form" class="form" style="max-width:400px"><label>当前密码</label><input id="pw-old" type="password" required><label>新密码（至少14字符）</label><input id="pw-new" type="password" minlength="14" required><button class="btn primary" type="submit" style="margin-top:12px">修改密码</button></form></section><section class="panel"><h2>近期操作审计</h2><div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>操作</th><th>对象 ID</th><th>说明</th></tr></thead><tbody>'+a.items.map(x=>'<tr><td>'+date(x.at)+'</td><td>'+escapeHTML(x.action)+'</td><td>'+escapeHTML(x.target)+'</td><td>'+escapeHTML(x.detail)+'</td></tr>').join('')+'</tbody></table></div></section>';
$('#toggle-legacy').onclick=async()=>{if(!confirm('确定改变旧版 API Key 的启用状态？'))return;try{await api('/settings','PUT',{legacy_api_key_enabled:!s.legacy_api_key_enabled});await navigate(page)}catch(e){toast(e.message)}};$('#pw-form').onsubmit=async e=>{e.preventDefault();try{await api('/password','POST',{old:$('#pw-old').value,new:$('#pw-new').value});$('#pw-form').reset();toast('密码已更新')}catch(e){toast(e.message)}}}
boot();
</script>
</body>
</html>
