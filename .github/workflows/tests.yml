name: Test admin
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'fastapi>=0.110' 'cryptography>=42,<48' 'httpx>=0.27' 'pytest>=8'
      - run: python -m pytest -q tests/test_admin.py
